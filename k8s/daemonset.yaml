apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coz
  namespace: default
  labels:
    app: coz
spec:
  selector:
    matchLabels:
      app: coz
  template:
    metadata:
      labels:
        app: coz
    spec:
      serviceAccountName: coz
      hostPID: true
      containers:
        - name: coz
          image: yunniverse/mcoz:1.0
          imagePullPolicy: IfNotPresent
          # Container idles; run commands on demand via kubectl exec and cozctl
          command: ["bash","-lc"]
          args: ["exec tail -f /dev/null"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            # If your cluster supports fine-grained caps, you can try enabling instead of privileged
            # capabilities:
            #   add: ["SYS_ADMIN", "PERFMON"]
          volumeMounts:
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              mountPropagation: HostToContainer
              readOnly: false
            # Optional: mount kernel debug fs if needed for perf
            # - name: sys-kernel-debug
            #   mountPath: /sys/kernel/debug
            #   readOnly: true
      volumes:
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        # - name: sys-kernel-debug
        #   hostPath:
        #     path: /sys/kernel/debug
        #     type: Directory
