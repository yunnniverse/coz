apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coz
  namespace: mcoz-system
  labels:
    app: coz
spec:
  selector:
    matchLabels:
      app: coz
  template:
    metadata:
      labels:
        app: coz
    spec:
      serviceAccountName: coz
      hostPID: true
      # Ensure kernel perf sysctls are permissive on the node
      initContainers:
        # - name: mount-perf-event
        #   image: busybox:1.36
        #   securityContext:
        #     privileged: true
        #   command: ["sh","-c"]
        #   args:
        #     - |
        #       set -e
        #       # Skip on cgroup v2
        #       if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
        #         echo "[coz-daemon] cgroup v2 detected; skipping perf_event mount"
        #         exit 0
        #       fi
        #       # If already mounted, nothing to do
        #       if mountpoint -q /sys/fs/cgroup/perf_event; then
        #         echo "[coz-daemon] perf_event already mounted"
        #         exit 0
        #       fi
        #       echo "[coz-daemon] mounting perf_event controller on host"
        #       nsenter --mount=/hostproc/1/ns/mnt -- sh -lc '
        #         mkdir -p /sys/fs/cgroup/perf_event || true;
        #         mount -t cgroup -o perf_event cgroup /sys/fs/cgroup/perf_event || true;
        #         mountpoint -q /sys/fs/cgroup/perf_event && echo "[host] perf_event mounted" || echo "[host] mount failed (maybe unsupported)";
        #       '
        #   volumeMounts:
        #     - name: host-proc
        #       mountPath: /hostproc
        # - name: sysctl
        #   image: busybox:1.36
        #   securityContext:
        #     privileged: true
        #   command: ["sh","-c"]
        #   args:
        #     - |
        #       echo "[coz-daemon] tuning sysctls: kernel.perf_event_paranoid=1, kernel.kptr_restrict=0";
        #       sysctl -w kernel.perf_event_paranoid=1 || true;
        #       sysctl -w kernel.kptr_restrict=0 || true;
        #       # best-effort; continue regardless
      containers:
        - name: coz
          image: yunniverse/mcoz:4.17
          imagePullPolicy: Always
          command: ["python3","-u","/usr/local/bin/mcoz_control_api.py"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTROL_PORT
              value: "19091"
            - name: MCOZ_GATE_CONTROL_NAMESPACES
              value: "trace-demo,social"
            - name: DELAY_SERVICE
              value: "coz-delay"
            - name: DELAY_PORT
              value: "9808"
            - name: GLOBAL_DELAY_NAME
              value: "global-delay"
            - name: KUBE_GROUP
              value: "example.com"
            - name: KUBE_VERSION
              value: "v1alpha1"
            - name: KUBE_PLURAL
              value: "globaldelays"
            - name: SPEEDUP
              value: "0.25"
          ports:
            - name: control
              containerPort: 19091
              protocol: TCP
            - name: delay-udp
              containerPort: 9808
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 19091
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 19091
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN","SYS_PTRACE","SYS_NICE","PERFMON"]
          # If your cluster supports fine-grained caps, you can try enabling instead of privileged
          # capabilities:
          #   add: ["SYS_ADMIN", "PERFMON"]
          volumeMounts:
            - name: mcoz-control-script
              mountPath: /usr/local/bin/mcoz_control_api.py
              subPath: mcoz_control_api.py
              readOnly: true
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              mountPropagation: HostToContainer
              readOnly: false
            - name: sys-kernel-tracing
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
            # - name: mcozdev
            #   mountPath: /dev/mcoz
      volumes:
        - name: mcoz-control-script
          configMap:
            name: mcoz-control-script
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: sys-kernel-tracing
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        # - name: mcozdev
        #   hostPath:
        #     path: /dev/mcoz
        #     type: CharDevice
