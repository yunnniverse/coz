apiVersion: batch/v1
kind: Job
metadata:
  name: coz-start-trigger
  namespace: mcoz-system
spec:
  template:
    spec:
      serviceAccountName: coz
      restartPolicy: Never
      containers:
        - name: trigger
          image: yunniverse/mcoz:2.5 ## 뭐가 문제진 모르겠는데.. 절대 바꾸지 말것.. 지금이.. 조하..
          imagePullPolicy: IfNotPresent
          command: ["bash","-lc"]
          args:
            - |
              set -euo pipefail
              if [[ -z "${TARGET_POD:-}" ]]; then
                echo "[coz-trigger] ERROR: TARGET_POD env not set (expected format NAMESPACE/POD)" >&2
                exit 1
              fi
              echo "[coz-trigger] Signaling start for DaemonSet pods via ConfigMap $NAMESPACE/coz-sync (targetPod='${TARGET_POD}')"
              kubectl create configmap coz-sync -n "$NAMESPACE" \
                --from-literal=start=go \
                --from-literal=targetPod="${TARGET_POD}" \
                --from-literal=speedup="${SPEEDUP}" \
                --dry-run=client -o yaml | kubectl apply -f -
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Set parameters here; all DaemonSet pods read them from the ConfigMap.
            - name: TARGET_POD
              value: "default/busybox-8475b6d8cd-ljlnf"
            - name: SPEEDUP
              value: "0.1"
  backoffLimit: 0
