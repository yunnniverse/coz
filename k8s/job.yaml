apiVersion: batch/v1
kind: Job
metadata:
  name: coz-start-trigger
  namespace: mcoz-system
spec:
  template:
    spec:
      serviceAccountName: coz
      restartPolicy: Never
      containers:
        - name: trigger
          image: yunniverse/mcoz:3.9
          imagePullPolicy: IfNotPresent
          command: ["bash","-lc"]
          args:
            - |
              set -euo pipefail
              if [[ -z "${TARGET_POD:-}" ]]; then
                echo "[coz-trigger] ERROR: TARGET_POD env not set (expected format NAMESPACE/POD)" >&2
                exit 1
              fi
              echo "[coz-trigger] Starting mcoz via control API (targetPod='${TARGET_POD}', speedup='${SPEEDUP}', scope='${SCOPE}')"
              payload=$(cat <<JSON
              {"targetPod":"${TARGET_POD}","speedup":"${SPEEDUP}","scope":"${SCOPE}","force":${FORCE}}
              JSON
              )
              curl -sS -X POST "http://coz-control.${NAMESPACE}.svc.cluster.local:${CONTROL_PORT}/start" \
                -H "Content-Type: application/json" \
                -d "${payload}"
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TARGET_POD
              value: "trace-demo/d"
            - name: SPEEDUP
              value: "0.25"
            - name: SCOPE
              value: "all"
            - name: FORCE
              value: "true"
            - name: CONTROL_PORT
              value: "19091"
  backoffLimit: 0
