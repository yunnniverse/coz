apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: globaldelays.example.com
spec:
  group: example.com
  scope: Cluster
  names:
    kind: GlobalDelay
    plural: globaldelays
    singular: globaldelay
    shortNames:
      - gdelay
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Value
          type: integer
          jsonPath: .spec.value
        - name: Version
          type: integer
          jsonPath: .spec.version
        - name: Updated
          type: date
          jsonPath: .status.lastUpdateTime
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["value"]
              properties:
                # 전역 지연 값 (정수, 0 이상)
                value:
                  type: integer
                  format: int64
                  minimum: 0
                  description: "global_delay (u64)"
                # 멱등/경합 해결용 스냅샷 버전(단조 증가 권장)
                version:
                  type: integer
                  format: int64
                  minimum: 0
                  default: 0
                  description: "monotonic snapshot version for idempotency"
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                appliedVersion:
                  type: integer
                  format: int64
                lastUpdateTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
