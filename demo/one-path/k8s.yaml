apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: front }
  template:
    metadata:
      labels: { app: front }
    spec:
      nodeSelector:
        node: yunni-desktop
      containers:
        - name: front
          image: yunniverse/demo-numberchain:0.8
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ROLE
              value: "front"
            - name: NEXT_SERVICE
              value: "one"
            - name: FORK_SERVICE          # ← 추가
              value: "extra"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: demo
spec:
  selector: { app: front }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
