apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: front }
  template:
    metadata:
      labels: { app: front }
    spec:
      containers:
        - name: front
          image: yunniverse/demo-numberchain:0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "front"
            - name: NEXT_SERVICE
              value: "one"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: demo
spec:
  selector: { app: front }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
